plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }

    // The Windows music helper (built by buildMusicHelper) is packed into the jar
    from("MusicHelper/publish") {
        include "RiftKingMusicHelper.exe"
        into "assets/riftkingextras/bin"
    }
}

tasks.named("processResources") {
    dependsOn("buildMusicHelper")
}

// Is the .NET SDK there? Without it the mod still builds, the music HUD then only works on Linux.
def dotnetAvailable = false
try {
    dotnetAvailable = ["dotnet", "--version"].execute().waitFor() == 0
} catch (Exception ignored) {
    dotnetAvailable = false
}

tasks.register("buildMusicHelper", Exec) {
    workingDir "MusicHelper"
    commandLine "dotnet", "publish", "-c", "Release", "-r", "win-x64", "--self-contained", "true", "-o", "publish"
    ignoreExitValue = true
    onlyIf { dotnetAvailable }
}

// Jar file name without version: build/libs/NameTagMod.jar
tasks.withType(Jar).configureEach {
    archiveVersion = ''
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
